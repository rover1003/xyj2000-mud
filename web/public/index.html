<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>西游记2000 — Web MUD</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.min.js"></script>

  <style>
    /* ===== 重置 ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }

    /* ===== 布局 ===== */
    #app {
      display: flex;
      height: 100vh;
      height: 100dvh;
      background: #1a1a2e;
      position: relative;
    }

    /* ===== 左侧主区 ===== */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
      color: #a8b2d1;
      font-size: 13px;
      flex-shrink: 0;
    }
    #toolbar .title { font-weight: bold; color: #e2e8f0; margin-right: auto; }

    #status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #ff6b6b; display: inline-block; transition: background 0.3s;
    }
    #status-dot.connected { background: #51cf66; }
    #status-dot.connecting { background: #ffd43b; }
    #status-text { font-size: 12px; color: #8892b0; }

    .tb-btn {
      background: #0f3460; color: #e2e8f0; border: none;
      padding: 4px 12px; border-radius: 3px; cursor: pointer; font-size: 12px;
    }
    .tb-btn:active { background: #1a4a7e; }

    /* ===== 状态条 (HP/MP/Exp) ===== */
    #status-stats {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px;
      background: #0d1117;
      border-bottom: 1px solid #0f3460;
      flex-shrink: 0;
      font-size: 12px;
      color: #a8b2d1;
      overflow-x: auto;
      white-space: nowrap;
    }
    .stat-item {
      display: flex; align-items: center; gap: 5px;
      flex-shrink: 0;
    }
    .stat-item .label { color: #64ffda; font-weight: 600; font-size: 11px; }
    .stat-item .bar {
      width: 70px; height: 8px; background: #21262d;
      border-radius: 2px; overflow: hidden; position: relative;
    }
    .stat-item .fill {
      height: 100%; background: #3fb950; transition: width 0.3s, background 0.3s;
    }
    .stat-item .fill.medium { background: #d29922; }
    .stat-item .fill.low { background: #f85149; }
    .stat-item .value { color: #c9d1d9; font-family: monospace; font-size: 11px; min-width: 55px; }
    .stat-item.empty .value { color: #4a5568; }
    #btn-refresh-stats {
      margin-left: auto; padding: 3px 10px;
      background: #0f3460; color: #64ffda; border: none;
      border-radius: 3px; cursor: pointer; font-size: 11px;
      flex-shrink: 0;
    }
    #btn-refresh-stats:active { background: #1a4a7e; }
    #btn-refresh-stats.loading { color: #ffd43b; }

    #terminal-container {
      flex: 1;
      background: #0d1117;
      padding: 4px;
      min-height: 0;
    }

    /* ===== 移动端虚拟方向键 ===== */
    #touch-pad {
      display: block;
      flex-shrink: 0;
      background: #0d1117;
      border-top: 1px solid #0f3460;
      padding: 6px 8px;
      user-select: none;
    }
    .dpad, .func-row { display: none; }
    .dpad {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3px;
      max-width: 210px;
      margin: 0 auto;
    }
    .dpad button {
      background: #0f3460; color: #e2e8f0; border: 1px solid #1a1a4e;
      border-radius: 6px; font-size: 20px; font-weight: bold;
      padding: 0; cursor: pointer;
      -webkit-user-select: none; user-select: none;
      touch-action: manipulation;
      min-height: 44px; min-width: 44px;
    }
    .dpad button:active { background: #64ffda; color: #0d1117; }

    .func-row {
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-top: 6px;
      max-width: 320px;
      margin-left: auto; margin-right: auto;
    }
    .func-row button {
      background: #0f3460; color: #64ffda; border: 1px solid #1a1a4e;
      border-radius: 4px; font-size: 11px; padding: 8px 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    .func-row button:active { background: #64ffda; color: #0d1117; }
    .func-row button .key-label { display: block; font-size: 9px; color: #8b949e; }
    .func-row button:active .key-label { color: #0d1117; }

    /* 自定义按钮 (桌面 + 移动端) */
    .custom-section {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #0f3460;
    }
    .custom-section .section-label {
      font-size: 10px; color: #8b949e; text-align: center;
      margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px;
    }
    .custom-row, .custom-edit {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      max-width: 360px;
      margin: 0 auto;
    }
    .custom-row button {
      background: #1a1a4e; color: #e2e8f0; border: 1px solid #64ffda;
      border-radius: 4px; font-size: 11px; padding: 8px 2px;
      cursor: pointer; touch-action: manipulation;
      min-height: 40px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
    .custom-row button:active { background: #64ffda; color: #0d1117; }
    .custom-row button.empty {
      border-style: dashed; color: #6e7681; background: #0d1117;
    }
    .custom-edit { display: none; }
    .custom-edit .cb-edit-item {
      display: flex; flex-direction: column; gap: 3px;
    }
    .custom-edit input {
      width: 100%; background: #0d1117; border: 1px solid #0f3460;
      color: #e2e8f0; padding: 4px; border-radius: 3px; font-size: 11px;
      text-align: center; font-family: inherit; min-width: 0;
    }
    .custom-edit input:focus { outline: none; border-color: #64ffda; }
    .custom-edit input::placeholder { color: #4a5568; }
    .custom-controls {
      display: flex; gap: 4px; justify-content: center; margin-top: 4px;
    }
    .custom-controls .tb-btn { font-size: 11px; padding: 3px 10px; }

    /* ===== 底部输入条 ===== */
    #input-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; background: #16213e;
      border-top: 1px solid #0f3460; flex-shrink: 0;
    }
    #input-bar label { color: #64ffda; font-size: 13px; font-weight: bold; }
    #cmd-input {
      flex: 1; background: #0d1117; border: 1px solid #0f3460;
      color: #e2e8f0; padding: 6px 10px; border-radius: 4px;
      font-size: 14px; font-family: 'Consolas', 'Courier New', monospace; outline: none;
    }
    #cmd-input:focus { border-color: #64ffda; }
    #cmd-input::placeholder { color: #4a5568; }
    #btn-send {
      padding: 6px 16px; background: #64ffda; color: #1a1a2e;
      border: none; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    #btn-send:active { background: #45e6be; }

    /* ===== 状态栏 ===== */
    #statusbar {
      display: flex; align-items: center; gap: 16px;
      padding: 2px 12px; background: #0d1117;
      border-top: 1px solid #0f3460; color: #4a5568;
      font-size: 11px; flex-shrink: 0;
    }

    /* ===== 右侧面板 ===== */
    #side-panel {
      width: 280px; background: #16213e;
      border-left: 1px solid #0f3460;
      display: flex; flex-direction: column;
      flex-shrink: 0; overflow: hidden;
      transition: transform 0.3s ease;
    }

    .panel-tabs {
      display: flex; border-bottom: 1px solid #0f3460; flex-shrink: 0;
    }
    .panel-tab {
      flex: 1; padding: 8px 4px; text-align: center;
      font-size: 12px; color: #8892b0; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.2s; user-select: none;
    }
    .panel-tab:hover { color: #e2e8f0; background: #1a1a3e; }
    .panel-tab.active { color: #64ffda; border-bottom-color: #64ffda; }

    .panel-body {
      flex: 1; overflow-y: auto; padding: 8px; display: none;
    }
    .panel-body.active { display: block; }

    .binding-group { margin-bottom: 10px; }
    .binding-group-title {
      font-size: 11px; color: #64ffda; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 4px; padding: 4px 0;
      border-bottom: 1px solid #0f3460;
    }
    .binding-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 3px 0; font-size: 13px; color: #a8b2d1;
    }
    .binding-row .key {
      background: #0f3460; padding: 1px 8px; border-radius: 3px;
      font-family: monospace; font-size: 12px; color: #e2e8f0;
      min-width: 60px; text-align: center;
    }
    .binding-row .action { color: #64ffda; font-size: 12px; }
    .binding-row .bind-edit {
      background: #0f3460; border: 1px solid #1a1a4e; color: #e2e8f0;
      padding: 1px 6px; border-radius: 3px; font-size: 12px;
      width: 100px; font-family: monospace;
    }
    .binding-row .bind-edit:focus { outline: none; border-color: #64ffda; }

    #log-area { font-size: 12px; line-height: 1.5; color: #8892b0; }
    #log-area .log-line { padding: 1px 0; }
    #log-area .log-line .time { color: #4a5568; margin-right: 6px; }

    /* 状态详情面板 */
    #stats-detail { font-size: 12px; line-height: 1.7; color: #a8b2d1; }
    #stats-detail .row { display: flex; justify-content: space-between; padding: 2px 0; }
    #stats-detail .row .k { color: #64ffda; }
    #stats-detail .row .v { font-family: monospace; }
    #stats-detail hr { border: none; border-top: 1px solid #0f3460; margin: 6px 0; }
    #stats-detail .raw {
      font-family: monospace; font-size: 11px; color: #6e7681;
      background: #0d1117; padding: 6px; border-radius: 3px;
      white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto;
    }

    /* ===== 面板切换按钮 (移动端) ===== */
    #btn-panel-toggle {
      display: none;
      position: fixed; right: 12px; bottom: 70px;
      width: 44px; height: 44px; border-radius: 50%;
      background: #0f3460; color: #64ffda; border: 1px solid #64ffda;
      font-size: 20px; cursor: pointer; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    #btn-panel-toggle:active { background: #64ffda; color: #0d1117; }

    /* 触摸触发的方向键映射 (移动端) */
    #btn-dpad-toggle {
      display: none;
    }
    #btn-dpad-toggle.active { background: #64ffda; color: #0d1117; }

    /* 面板遮罩 (移动端) */
    #panel-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 49;
    }
    #panel-overlay.show { display: block; }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #1a4a7e; }

    /* ===== 移动端响应式 ===== */
    @media (max-width: 768px) {
      #toolbar { font-size: 12px; padding: 4px 8px; gap: 6px; }
      #toolbar .title { font-size: 13px; }
      .tb-btn { padding: 4px 8px; font-size: 11px; }
      #status-text { display: none; }

      #status-stats { font-size: 11px; gap: 6px; padding: 4px 8px; }
      .stat-item .bar { width: 50px; height: 7px; }
      .stat-item .value { min-width: 45px; font-size: 10px; }
      #btn-refresh-stats { font-size: 10px; padding: 3px 6px; }

      #cmd-input { font-size: 16px; }

      #side-panel {
        position: fixed; top: 0; right: 0; bottom: 0;
        width: 85vw; max-width: 320px;
        z-index: 50;
        transform: translateX(100%);
        box-shadow: -4px 0 16px rgba(0,0,0,0.5);
      }
      #side-panel.open { transform: translateX(0); }

      #touch-pad { display: block; }
      .dpad { display: grid !important; }
      .func-row { display: grid !important; }
      #btn-panel-toggle { display: block; }
      #btn-dpad-toggle { display: block; }
    }

    /* 平板 */
    @media (min-width: 769px) and (max-width: 1024px) {
      #side-panel { width: 240px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="main">
      <!-- 工具栏 -->
      <div id="toolbar">
        <span class="title">🐵 西游</span>
        <span id="status-dot"></span>
        <span id="status-text">未连接</span>
        <button id="btn-dpad-toggle" class="tb-btn" title="显示/隐藏方向键">🎮</button>
        <button id="btn-connect" class="tb-btn">连接</button>
        <button id="btn-disconnect" class="tb-btn" style="display:none;">断开</button>
      </div>

      <!-- 状态条 -->
      <div id="status-stats">
        <div class="stat-item empty" id="stat-hp">
          <span class="label">气血</span>
          <div class="bar"><div class="fill" style="width:0%"></div></div>
          <span class="value">--/--</span>
        </div>
        <div class="stat-item empty" id="stat-spirit">
          <span class="label">精神</span>
          <div class="bar"><div class="fill" style="width:0%"></div></div>
          <span class="value">--/--</span>
        </div>
        <div class="stat-item empty" id="stat-fali">
          <span class="label">法力</span>
          <div class="bar"><div class="fill" style="width:0%"></div></div>
          <span class="value">--/--</span>
        </div>
        <div class="stat-item empty" id="stat-neili">
          <span class="label">内力</span>
          <div class="bar"><div class="fill" style="width:0%"></div></div>
          <span class="value">--/--</span>
        </div>
        <button id="btn-refresh-stats">⟳ 刷新</button>
      </div>

      <!-- 终端 -->
      <div id="terminal-container"></div>

      <!-- 虚拟方向键 (移动端) -->
      <div id="touch-pad">
        <div class="dpad">
          <button data-action="northwest">↖</button>
          <button data-action="north">↑</button>
          <button data-action="northeast">↗</button>
          <button data-action="west">←</button>
          <button data-action="look">·</button>
          <button data-action="east">→</button>
          <button data-action="southwest">↙</button>
          <button data-action="south">↓</button>
          <button data-action="southeast">↘</button>
        </div>
        <div class="func-row">
          <button data-action="help">帮助<span class="key-label">/</span></button>
          <button data-action="hp">状态<span class="key-label">*</span></button>
          <button data-action="skills">技能<span class="key-label">-</span></button>
          <button data-action="score">分数<span class="key-label">+</span></button>
          <button data-action="inventory">物品<span class="key-label">.</span></button>
        </div>

        <!-- 5 个自定义按钮 (桌面 + 移动端) -->
        <div class="custom-section">
          <div class="section-label">⌨ 自定义按钮 (点 ✏ 配置)</div>
          <div class="custom-row" id="custom-row"></div>
          <div class="custom-edit" id="custom-edit"></div>
          <div class="custom-controls">
            <button id="btn-edit-custom" class="tb-btn">✏ 编辑</button>
            <button id="btn-save-custom" class="tb-btn" style="display:none;">💾 保存</button>
            <button id="btn-cancel-custom" class="tb-btn" style="display:none;">取消</button>
          </div>
        </div>
      </div>

      <!-- 输入条 -->
      <div id="input-bar">
        <label>&gt;</label>
        <input type="text" id="cmd-input" placeholder="输入命令... (Enter发送)" autocomplete="off">
        <button id="btn-send">发送</button>
      </div>

      <div id="statusbar">
        <span id="sb-mud">MUD: 未连接</span>
        <span id="sb-keys">键绑定: 已启用</span>
        <span id="sb-stats" style="color:#4a5568;">状态: 未刷新</span>
      </div>
    </div>

    <!-- 右侧面板 -->
    <div id="side-panel">
      <div class="panel-body active" id="panel-stats" style="display:block;">
        <div id="stats-detail">
          <div class="row"><span class="k">气血</span><span class="v" id="d-hp">--/--</span></div>
          <div class="row"><span class="k">精神</span><span class="v" id="d-spirit">--/--</span></div>
          <div class="row"><span class="k">法力</span><span class="v" id="d-fali">--/--</span></div>
          <div class="row"><span class="k">内力</span><span class="v" id="d-neili">--/--</span></div>
          <hr>
          <div class="row"><span class="k">姓名</span><span class="v" id="d-name">--</span></div>
          <div class="row"><span class="k">年龄</span><span class="v" id="d-age">--</span></div>
          <div class="row"><span class="k">潜能</span><span class="v" id="d-potential">--</span></div>
          <div class="row"><span class="k">杀气</span><span class="v" id="d-kill">--</span></div>
          <div class="row"><span class="k">兵器</span><span class="v" id="d-weapon">--</span></div>
          <div class="row"><span class="k">盔甲</span><span class="v" id="d-armor">--</span></div>
          <hr>
          <div class="row"><span class="k">道行境</span><span class="v" id="d-dao">--</span></div>
          <div class="row"><span class="k">武学境</span><span class="v" id="d-martial">--</span></div>
          <div class="row"><span class="k">法境</span><span class="v" id="d-magic">--</span></div>
          <div class="row"><span class="k">内境</span><span class="v" id="d-neili-lv">--</span></div>
          <hr>
          <div style="color:#8b949e;font-size:11px;margin-bottom:4px;">原始输出 (用于调试):</div>
          <div class="raw" id="d-raw">尚未刷新。点 ⟳ 刷新按钮发送 hp 命令。</div>
        </div>
      </div>
    </div>

    <div id="panel-overlay"></div>
    <button id="btn-panel-toggle">☰</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
